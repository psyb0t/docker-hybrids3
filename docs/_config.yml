title: HybridS3
tagline: Object storage that speaks S3, plain HTTP and MCP
description: A single-container object storage server with an S3-compatible API, a plain HTTP API with Bearer tokens and an MCP server, backed by SQLite metadata and flat files.
lang: en
url: https://psyb0t.github.io
baseurl: /docker-hybrids3
repository: psyb0t/docker-hybrids3
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/docker-hybrids3
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/docker-hybrids3/blob/main/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/docker-hybrids3
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree
